<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>카카오 지도 API 테스트</title>
</head>

<body>
    <h1>카카오 지도 API 테스트</h1>
    <div id="map" style="width:500px;height:400px;"></div>
    <div id="result"></div>

    <script type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=82dc08657c02650581b6fc19b03d13f8&libraries=services"></script>
    <script>
        const resultDiv = document.getElementById('result');

        // 1. window.kakao 확인
        if (window.kakao) {
            resultDiv.innerHTML += '<p>✅ window.kakao 로드 성공</p>';
        } else {
            resultDiv.innerHTML += '<p>❌ window.kakao 로드 실패</p>';
        }

        // 2. 지도 생성
        try {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5665, 126.9780),
                level: 3
            };
            const map = new kakao.maps.Map(container, options);
            resultDiv.innerHTML += '<p>✅ 지도 생성 성공</p>';

            // 3. 장소 검색 테스트
            const ps = new kakao.maps.services.Places();
            ps.keywordSearch('동안교회', function (data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    resultDiv.innerHTML += '<p>✅ 장소 검색 성공</p>';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(data[0], null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML += '<p>❌ 장소 검색 실패: ' + status + '</p>';
                }
            });
        } catch (error) {
            resultDiv.innerHTML += '<p>❌ 에러: ' + error.message + '</p>';
        }
    </script>
</body>

</html>
